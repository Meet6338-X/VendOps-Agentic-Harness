[project]
name = "vendops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Meet6338-X", email = "shahmeet644@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith>=0.14.17",
    "mcp>=2.3.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vendops = "vendops:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.poe.tasks]
test = "pytest"
lint = "ruff check ."
typecheck = "mypy src"
qdrant-up = "docker compose up -d qdrant"
qdrant-down = "docker compose down"
demo = "python -c \"print('not implemented yet')\""
eval = "python -c \"print('not implemented yet')\""
gate = "python -c \"print('not implemented yet')\""

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

