name: CI

on:
  push:
    branches: ["main", "feat/*"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-release-gate:
    name: Lint, Test & Release Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Typecheck with mypy
        run: uv run mypy src evals scripts

      - name: Run Pytest suite
        run: uv run pytest

      - name: Run Release Gate Check (Offline Deterministic Fixtures)
        run: uv run python scripts/release_gate.py
