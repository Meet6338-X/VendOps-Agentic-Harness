services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vendops-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped

  vendops:
    build:
      context: .
      dockerfile: Dockerfile
    image: vendops:latest
    container_name: vendops-service
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - HIGH_VALUE_THRESHOLD=100000
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  qdrant_storage:
  sqlite_data:
